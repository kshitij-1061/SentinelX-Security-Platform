services:
  # 1. PostgreSQL Database Service
  - type: postgres
    name: cyber-defense-db
    ipAllowList: [] # allow all internal render connections
    databaseName: cyber_defense_db
    user: cyber_user
    plan: starter

  # 2. Node.js + Express Backend API Service
  - type: web
    name: cyber-defense-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx prisma db seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-defense-db
          property: connectionString

  # 3. Next.js Frontend Dashboard Web Service
  - type: web
    name: cyber-defense-frontend
    env: node
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://cyber-defense-backend.onrender.com/api/v1
