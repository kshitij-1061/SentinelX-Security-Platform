version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyber_defense_postgres
    restart: always
    environment:
      POSTGRES_USER: cyber_user
      POSTGRES_PASSWORD: cyber_password123
      POSTGRES_DB: cyber_defense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_user -d cyber_defense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_defense_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://cyber_user:cyber_password123@postgres:5432/cyber_defense_db?schema=public
      - JWT_SECRET=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_defense_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
